name: Verify and publish CodeMirror Java
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  # Required to publish SpotBugs SARIF to code scanning.
  security-events: write
concurrency:
  group: codemirror-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 30
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN || secrets.FORGEJO_PACKAGE_READ_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify reproducible pinned browser assets
        run: npm ci && npm run check:assets
      - name: Allocate isolated caches
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/codemirror-browsers-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "MAVEN_CACHE=$RUNNER_TEMP/codemirror-m2-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Build and install artifacts for browser setup
        run: mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE" clean install -DskipTests
      - name: Install browser engines
        run: >-
          mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE"
          -f codemirror-showcase/pom.xml org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.args="install chromium webkit"
      - name: Verify standard build
        run: mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE" verify
      - name: Verify optimized production build
        run: mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE" -Pproduction clean verify
      - name: Verify repository remains clean
        run: git diff --exit-code
      - name: SonarQube analysis
        # Analysis belongs to the default branch only: a pull-request run would
        # otherwise replace the project's main analysis with unmerged code.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          SONAR_HOST_URL: https://sonar.instanto.io
        run: >-
          mvn -s .github/maven-settings.xml -B -ntp -Dmaven.repo.local="$MAVEN_CACHE"
          sonar:sonar -Dsonar.projectKey=codemirror-java -Dsonar.projectName=codemirror-java
          -Dsonar.qualitygate.wait=true
      - name: Publish quality summary
        if: always()
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/quality-summary@main
        with:
          sonar-project-key: codemirror-java
          sonar-token: ${{ secrets.SONAR_READ_TOKEN || secrets.SONAR_TOKEN }}
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugs/'
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            codemirror-gwt-tests/target/failsafe-reports/
            codemirror-showcase/target/failsafe-reports/
            codemirror-showcase/target/*.png
      - name: Upload verified showcase
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: codemirror-showcase/target/site
      - name: Remove isolated caches
        if: always()
        run: rm -rf -- "$MAVEN_CACHE" "$PLAYWRIGHT_BROWSERS_PATH"
  publish-snapshot:
    # Both compiler targets and browser engines must pass for this commit first.
    # Manual main runs follow the same gate; pull requests never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish CodeMirror Java snapshots to packages.instanto.io
      goals: clean deploy
      maven-args: -DskipTests
      timeout-minutes: 60
    secrets: inherit
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified showcase
        id: deployment
        uses: actions/deploy-pages@v4
